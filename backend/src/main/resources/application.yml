spring:
  application:
    name: humanitarian-logistics
  messages:
    encoding: UTF-8
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistics}?charSet=UTF-8
    username: ${DB_USER:logistics}
    password: ${DB_PASSWORD:logistics}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

server:
  # Слухати на всіх інтерфейсах — доступ по LAN IP, не лише 127.0.0.1
  address: 0.0.0.0
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    org.hibernate.SQL: WARN

app:
  jwt:
    issuer: humanitarian-logistics
    # Override in production: APP_JWT_SECRET
    secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me}
    accessTtlSeconds: ${APP_JWT_ACCESS_TTL_SECONDS:28800}

springdoc:
  swagger-ui:
    persist-authorization: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health
